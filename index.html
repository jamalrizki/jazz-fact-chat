<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jazz Fact Chat</title>
  <meta name="description" content="A small AI chat about jazz that answers from Wikipedia and MusicBrainz using tool calls and an MCP server.">
  <meta name="theme-color" content="#050507">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="topnav"><a href="docs.html">How it works →</a></nav>
    <h1>Jazz Fact Chat</h1>
    <p class="tagline">Ask about musicians, records, and theory.</p>
  </header>

  <main id="chat" aria-live="polite">
    <div class="msg assistant">Hey there. Ask me about a player, an album, or ask for the chord chart to a tune.</div>
  </main>

  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Chords for Autumn Leaves in E minor?" maxlength="4000" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <footer id="status"></footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
